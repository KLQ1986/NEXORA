[project]
name = "nexora"
version = "0.1.0"
description = "NEXORA: a local-first, AI-assisted video production system for one operator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Dependency rules of the layered architecture (design v4.0, section 4.4).
[tool.importlinter]
root_package = "nexora"

[[tool.importlinter.contracts]]
name = "Layers: a layer may import lower layers, never higher ones"
type = "layers"
layers = ["nexora.api", "nexora.agents", "nexora.adapters", "nexora.modules", "nexora.core"]

[[tool.importlinter.contracts]]
name = "Domain modules do not import each other"
type = "independence"
modules = [
    "nexora.modules.planning",
    "nexora.modules.library",
    "nexora.modules.intelligence",
    "nexora.modules.sourcing",
    "nexora.modules.edit",
    "nexora.modules.quality",
    "nexora.modules.distribution",
]

[[tool.importlinter.contracts]]
name = "Only the Video Intelligence domain writes the canonical model; every other module reads it"
type = "forbidden"
source_modules = [
    "nexora.modules.planning",
    "nexora.modules.library",
    "nexora.modules.sourcing",
    "nexora.modules.edit",
    "nexora.modules.quality",
    "nexora.modules.distribution",
    "nexora.agents",
]
forbidden_modules = ["nexora.core.intelligence_store"]
